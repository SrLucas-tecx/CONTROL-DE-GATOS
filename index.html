<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FinanzasPro - Control y Crecimiento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Menú lateral -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-mark"><i class="fa-solid fa-wallet"></i></div>
            <div>
                <h2>FinanzasPro</h2>
                <span>Control &amp; Crecimiento</span>
            </div>
        </div>
        <nav>
            <ul>
                <li class="active"><a href="#" id="nav-dashboard" data-view="dashboard"><i class="fa-solid fa-chart-pie ico-brand"></i> Inicio</a></li>
                <li><a href="#" id="nav-cuentas" data-view="cuentas"><i class="fa-solid fa-vault ico-emerald"></i> Cuentas</a></li>
                <li><a href="#" id="nav-movimientos" data-view="movimientos"><i class="fa-solid fa-list-check ico-cyan"></i> Movimientos</a></li>
                <li><a href="#" id="nav-deudas" data-view="deudas"><i class="fa-solid fa-hand-holding-dollar ico-rose"></i> Deudas</a></li>
                <li><a href="#" id="nav-prestamos" data-view="prestamos"><i class="fa-solid fa-handshake ico-purple"></i> Préstamos</a></li>
                <li><a href="#" id="nav-metas" data-view="metas"><i class="fa-solid fa-bullseye ico-amber"></i> Metas de Ahorro</a></li>
                <li><a href="#" id="nav-ajustes" data-view="ajustes"><i class="fa-solid fa-sliders ico-muted"></i> Ajustes &amp; Portabilidad</a></li>
            </ul>
        </nav>
        <div class="sidebar-foot">
            <span class="status"><i class="fa-solid fa-circle"></i> Local Storage</span>
            <p>Tus datos nunca salen de tu navegador.</p>
        </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
        <header>
            <div><h1 id="page-title">Panel Principal</h1><p id="page-sub" class="sub"></p></div>
            <div class="header-actions">
                <button id="btn-ojo" class="btn-outline icon-only" type="button" aria-pressed="false" aria-label="Ocultar montos" title="Ocultar montos"><i class="fa-solid fa-eye"></i></button>
                <div class="menu-wrap">
                    <button id="btn-menu" class="btn-outline icon-only" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Más acciones" title="Más acciones"><i class="fa-solid fa-ellipsis"></i></button>
                    <div id="menu-header" class="menu hidden" role="menu">
                        <button id="btn-ajuste-rapido" class="menu-item" type="button" role="menuitem"><i class="fa-solid fa-scale-balanced"></i> Conciliar saldos</button>
                    </div>
                </div>
                <button id="btn-nuevo-mov" class="btn-primary"><i class="fa-solid fa-plus"></i> Nuevo Movimiento</button>
            </div>
        </header>

        <section id="module-container" class="module-container"></section>
    </main>

    <!-- Modal genérico (lo reutilizan todos los formularios) -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-head">
                <h3 id="modal-title"></h3>
                <button type="button" class="icon-btn" data-close aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="modal-form" autocomplete="off"></form>
        </div>
    </div>

    <!-- Navegación inferior (solo móvil) -->
    <nav class="bottom-nav" aria-label="Navegación principal">
        <a href="#" class="bn-item active" data-view="dashboard"><i class="fa-solid fa-chart-pie"></i><span>Inicio</span></a>
        <a href="#" class="bn-item" data-view="cuentas"><i class="fa-solid fa-vault"></i><span>Cuentas</span></a>
        <a href="#" class="bn-item" data-view="movimientos"><i class="fa-solid fa-list-check"></i><span>Movimientos</span></a>
        <a href="#" class="bn-item" data-view="deudas"><i class="fa-solid fa-hand-holding-dollar"></i><span>Deudas</span></a>
        <button type="button" id="bn-mas" class="bn-item" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-ellipsis"></i><span>Más</span></button>
        <div id="bn-sheet" class="bn-sheet hidden" role="menu">
            <a href="#" class="bn-sheet-item" data-view="prestamos" role="menuitem"><i class="fa-solid fa-handshake"></i> Préstamos</a>
            <a href="#" class="bn-sheet-item" data-view="metas" role="menuitem"><i class="fa-solid fa-bullseye"></i> Metas de Ahorro</a>
            <a href="#" class="bn-sheet-item" data-view="ajustes" role="menuitem"><i class="fa-solid fa-sliders"></i> Ajustes</a>
        </div>
    </nav>

    <div id="toast-container" aria-live="polite"></div>
    <input type="file" id="input-importar" accept=".json,application/json" hidden>

    <script type="module" src="js/main.js"></script>
</body>
</html>
